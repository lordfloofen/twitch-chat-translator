<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Twitch Chat Translator Settings</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
        max-width: 560px;
        margin: 0 auto;
        background: #0e0e10;
        color: #f7f7f8;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input[type='password'],
      input[type='text'] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #3a3a3d;
        background: #18181b;
        color: inherit;
        box-sizing: border-box;
      }

      button {
        margin-top: 16px;
        background: #a970ff;
        color: #0e0e10;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      #status {
        margin-top: 12px;
        min-height: 1.2em;
        font-size: 0.95rem;
      }

      a {
        color: #a970ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Twitch Chat Translator</h1>
      <p>
        Enter your OpenAI API key. The key is stored locally in your browser using
        <code>chrome.storage.local</code> and is only used to call the ChatGPT API for
        translations.
      </p>
      <label for="apiKey">OpenAI API Key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." />
      <button id="save">Save API Key</button>
      <div id="status" role="status" aria-live="polite"></div>
      <p>
        Need an API key? Visit the
        <a href="https://platform.openai.com/account/api-keys" target="_blank" rel="noopener"
          >OpenAI dashboard</a
        >.
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
